<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siyue Zhang Portfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  #modalContent iframe{
  max-width:90vw;
  max-height:85vh;
}
}
html, body {
  background: #181818;
  overflow-x: hidden;
  font-family: "Helvetica Neue", Arial, sans-serif;
}

/* 弹窗容器 */
#modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#modalContent {
  max-width: 86vw;
  max-height: 88vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#modalContent img,
#modalContent video {
  max-width: 100%;
  max-height: 88vh;
  object-fit: contain;
  background: #000;
}

/* 左右翻页按钮 */
#prevBtn, #nextBtn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  font-size: 32px;
  padding:14px 16px;
  cursor: pointer;
  user-select: none;
  border-radius:6px;
}
#prevBtn:hover, #nextBtn:hover {
  background: rgba(255,255,255,0.18);
}
#prevBtn { left:24px; }
#nextBtn { right:24px; }

/* 关闭按钮 */
#closeBtn {
  position: absolute;
  top:24px;
  right:28px;
  background: rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.25);
  color:#fff;
  font-size:24px;
  width:44px;
  height:44px;
  border-radius:50%;
  cursor:pointer;
}

/* 底部页码文字 例如 3 / 15 */
#pageNum {
  position: absolute;
  bottom:30px;
  left:50%;
  transform: translateX(-50%);
  color:#cccccc;
  font-size:16px;
  letter-spacing:1px;
}
</style>
</head>
<body>

<div id="modal">
  <button id="prevBtn">←</button>
  <div id="modalContent"></div>
  <button id="nextBtn">→</button>
  <button id="closeBtn">✕</button>
  <div id="pageNum"></div>
</div>

<script src="sketch.js"></script>
</body>
</html>
